    <h1>Lesson 1: What is a Buffer?</h1>
    <p>A buffer solution is a mixture of a weak acid and its conjugate base (or a weak base and its conjugate acid) that resists changes in pH when small amounts of acid or base are added.</p>

        <p>Why does a buffer resist a change in pH?</p>
